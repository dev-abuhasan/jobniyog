name: Deploy BCS Vocabulary

on:
  push:
    branches:
      - main
    paths:
      - "bcs-vocabulary/**"
      - ".github/workflows/deploy-bcs-vocabulary.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload BCS Vocabulary
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./bcs-vocabulary"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
