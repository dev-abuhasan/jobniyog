<style>
  /* ===== THEME VARIABLES ===== */
  :root {
    --header-h: 92px;
    --bg: #0f172a; --panel: #111827; --card: #0b1220;

    --txt: #f1f5f9; --txt-2: #cbd5e1; --txt-mute: #94a3b8;
    --accent: #10b981; --accent-2: #059669; --accent-txt: #6ee7b7;
    --warn: #f59e0b; --danger: #fb7185;
    --success: #34d399;
    --btn-bg: #1e293b; --btn-hover: #334155;
    --correct-bg: rgba(16,185,129,.15);
    --wrong-bg: rgba(251,113,133,.12);
  }
  body.light-theme {
    --bg: #f1f5f9; --panel: #ffffff; --card: #f8fafc;
    --line: #cbd5e1; --line-strong: #94a3b8;
    --txt: #0f172a; --txt-2: #334155; --txt-mute: #64748b;
    --accent: #059669; --accent-2: #047857; --accent-txt: #047857;
    --warn: #b45309; --danger: #be123c;
    --success: #047857;
    --btn-bg: #f1f5f9; --btn-hover: #e2e8f0;
    --correct-bg: #d1fae5;
    --wrong-bg: #fee2e2;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Hind Siliguri', 'Noto Sans Bengali', 'SolaimanLipi', 'Kalpurush', 'Siyam Rupali', system-ui, -apple-system, 'Segoe UI', sans-serif;
    line-height: 1.7;
    background: var(--bg) !important;
    color: var(--txt) !important;
    transition: background .25s ease, color .25s ease;
    overflow-x: hidden;
    margin: 0;
  }
  ::selection { background: rgba(16,185,129,.35); color: var(--txt); }

  h1,h2,h3,h4,p,span,a,button,label,td,th,li { overflow-wrap: anywhere; word-break: break-word; }
  button, input, select { font: inherit; line-height: 1.5; }
  button { min-height: 40px; cursor: pointer; }
  :focus-visible { outline: 3px solid #38bdf8; outline-offset: 2px; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 4px; }
  main section { scroll-margin-top: calc(var(--header-h) + 8px); }

  /* ===== NAV ===== */
  .nav-link { background: var(--btn-bg); color: var(--txt); border: 1px solid var(--line); white-space: nowrap; transition: background .15s, border-color .15s; }
  .nav-link:hover { background: var(--btn-hover); border-color: var(--accent); }
  .nav-primary { background: var(--warn); color: #111827 !important; border-color: #d97706; font-weight: 700; }
  .nav-primary:hover { background: #fbbf24; }

  /* ===== PANELS & CARDS ===== */
  .panel { background: var(--panel); border: 1px solid var(--line); color: var(--txt); }
  .muted { color: var(--txt-mute); }
  .eyebrow { color: var(--accent-txt); }
  .study-card { background: var(--card); border: 1px solid var(--line-strong); color: var(--txt); }
  .study-input { background: var(--card); color: var(--txt); border: 1px solid var(--line-strong); min-width: 0; }
  .study-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* ===== BUTTONS ===== */
  .action-btn { background: var(--accent-2); color: #fff; border: 1px solid var(--accent-2); }
  .action-btn:hover { background: var(--accent); }
  .secondary-btn, .mode-btn { background: var(--btn-bg); color: var(--txt); border: 1px solid var(--line-strong); }
  .secondary-btn:hover, .mode-btn:hover { background: var(--btn-hover); }
  .mode-btn.active { background: var(--accent-2); color: #fff; border-color: var(--accent); }

  /* ===== ANSWER OPTIONS ===== */
  .answer-option {
    display: block; width: 100%; text-align: left;
    padding: .9rem 1rem;
    border: 1px solid var(--line-strong);
    border-radius: .75rem;
    margin-top: .6rem;
    background: var(--card);
    color: var(--txt);
    transition: background .15s, border-color .15s;
    font-weight: 500;
    min-height: 48px;
  }
  .answer-option:hover:not(:disabled) { border-color: var(--accent); background: var(--btn-hover); }
  .answer-option.correct { border-color: #10b981; background: var(--correct-bg); color: var(--success); font-weight: 700; }
  .answer-option.wrong { border-color: var(--danger); background: var(--wrong-bg); color: var(--danger); }
  .answer-option:disabled { cursor: default; }

  /* ===== PROGRESS BAR ===== */
  .progress-track { background: var(--line); border-radius: 999px; overflow: hidden; height: 8px; }
  .progress-fill { background: linear-gradient(90deg, var(--accent-2), var(--accent)); height: 100%; transition: width .35s ease; }

  /* ===== FILTER CHIPS ===== */
  .filter-btn { border: 1px solid var(--line); background: var(--btn-bg); color: var(--txt); white-space: nowrap; transition: background .15s, border-color .15s; }
  .filter-btn:hover { background: var(--btn-hover); }
  .filter-btn.active-filter { background: var(--accent-2); color: #fff; border-color: var(--accent); }

  /* ===== ARTICLE CARDS ===== */
  .article-card { background: var(--panel); border: 1px solid var(--line); border-radius: .75rem; padding: 1rem; transition: border-color .15s, box-shadow .15s; }
  .article-card:hover { border-color: var(--accent); box-shadow: 0 4px 14px rgba(16,185,129,.15); }
  .article-num-badge { display:inline-flex; align-items:center; gap:.25rem; font-size:.7rem; font-weight:700; background: rgba(16,185,129,.15); color: var(--accent-txt); border:1px solid rgba(16,185,129,.3); padding:.15rem .55rem; border-radius:999px; }
  body.light-theme .article-num-badge { background:#d1fae5; color:#065f46; border-color:#6ee7b7; }
  .hot-badge { display:inline-flex; align-items:center; gap:.25rem; font-size:.65rem; font-weight:700; background: rgba(245,158,11,.18); color:#fbbf24; border:1px solid rgba(245,158,11,.35); padding:.15rem .55rem; border-radius:999px; }
  body.light-theme .hot-badge { background:#fef3c7; color:#92400e; border-color:#fcd34d; }

  /* ===== PART HEADER ===== */
  .part-header { background: linear-gradient(135deg, #065f46, #047857); color:#fff; padding:.85rem 1rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:.5rem; }
  body.light-theme .part-header { background: linear-gradient(135deg, #059669, #047857); }

  /* ===== STICKY SEARCH ===== */
  .search-wrap { position: sticky; top: var(--header-h); z-index: 30; background: var(--panel); }

  /* ===== TABLE ===== */
  table { color: var(--txt-2); }
  thead { background: var(--card); color: var(--txt); }
  tbody tr { border-color: var(--line) !important; }
  tbody td { border-color: var(--line); }

  /* ===== FLASHCARD SPECIFIC ===== */
  .flash-face {
    text-align: center;
    padding: 2rem 1rem;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
  }
  .flash-num-badge {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    padding: .35rem .9rem;
    border-radius: 999px;
    background: rgba(16,185,129,.15);
    color: var(--accent-txt);
    border: 1px solid rgba(16,185,129,.4);
    font-weight: 700;
    font-size: .85rem;
  }
  .flash-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--txt);
    line-height: 1.4;
  }
  .flash-answer {
    text-align: left;
    padding: 1rem 1.25rem;
    border-radius: .75rem;
    background: rgba(16,185,129,.1);
    border: 1px solid rgba(16,185,129,.35);
    width: 100%;
    max-width: 100%;
  }
  .flash-answer-label {
    font-size: .75rem;
    font-weight: 700;
    color: var(--accent-txt);
    margin-bottom: .35rem;
    text-transform: uppercase;
    letter-spacing: .05em;
  }
  .flash-answer-text {
    font-size: .95rem;
    color: var(--txt);
    line-height: 1.7;
  }

  /* ===== MCQ FEEDBACK ===== */
  .mcq-feedback {
    padding: .75rem 1rem;
    border-radius: .65rem;
    border-left: 4px solid;
    font-size: .9rem;
  }
  .mcq-feedback.ok { background: rgba(16,185,129,.1); border-color: #10b981; color: var(--success); }
  .mcq-feedback.no { background: rgba(251,113,133,.1); border-color: var(--danger); color: var(--danger); }
  body.light-theme .mcq-feedback.ok { background: #ecfdf5; }
  body.light-theme .mcq-feedback.no { background: #fff1f2; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 1024px) {
    nav.top-nav { width:100%; overflow-x:auto; flex-wrap:nowrap; scrollbar-width:thin; padding-bottom:2px; }
    nav.top-nav::-webkit-scrollbar { height:4px; }
  }
  @media (max-width: 640px) {
    :root { --header-h: 132px; }
    body.light-theme { --header-h: 132px; }
    .page-main { padding-left:.75rem; padding-right:.75rem; }
    .card-grid { grid-template-columns: 1fr !important; }
    .flash-face { padding: 1.25rem .5rem; min-height: 180px; }
    .flash-title { font-size: 1.05rem; }
  }

  .flash-enter { animation: fadeUp .35s ease-out; }
  @keyframes fadeUp { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
</style>
</head>

/* ============================================================
   STORAGE + UTILITIES
   ============================================================ */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};
const escapeHtml = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const shuffle = arr => { const c = arr.slice(); for (let i = c.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [c[i], c[j]] = [c[j], c[i]]; } return c; };
const allArticles = () => SITE_DATA.constitutionData.flatMap(p =>
  p.articles.map(a => ({ ...a, partTitle: p.partTitle, partRange: p.partRange }))
);

/* ============================================================
   RENDER: History
   ============================================================ */
function renderHistory(data) {
  const metrics = data.metrics.map(m => `
    <div class="p-4 rounded-xl" style="background: rgba(16,185,129,.08); border: 1px solid rgba(16,185,129,.25);">
      <p class="text-xs font-semibold eyebrow mb-1">${escapeHtml(m.label)}</p>
      <p class="text-lg sm:text-xl font-bold">${escapeHtml(m.value)}</p>
      <p class="text-xs ${m.accent ? 'font-semibold' : 'muted'} mt-1" ${m.accent ? 'style="color: var(--accent-txt);"' : ''}>${escapeHtml(m.sub)}</p>
    </div>`).join('');

  const cards = data.cards.map(c => {
    const items = c.items.map(it => {
      if (it.text) {
        return `<li class="${it.accent ? 'font-semibold' : 'muted'}" ${it.accent ? 'style="color: var(--accent-txt);"' : ''}>• ${escapeHtml(it.text)}</li>`;
      }
      return `<li class="muted">• <strong style="color: var(--txt);">${escapeHtml(it.label)}:</strong> ${escapeHtml(it.value)}</li>`;
    }).join('');
    return `
      <div class="p-4 rounded-xl" style="background: var(--card); border: 1px solid var(--line);">
        <h3 class="font-bold mb-2 flex items-center gap-2">
          <i data-lucide="${c.icon}" class="w-4 h-4" style="color: var(--accent);"></i> ${escapeHtml(c.title)}
        </h3>
        <ul class="space-y-1.5 text-sm">${items}</ul>
      </div>`;
  }).join('');

  return `
    <section id="history" class="panel p-5 sm:p-8 rounded-2xl">
      ${renderSectionHeader(data)}
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">${metrics}</div>
      <div class="grid md:grid-cols-3 gap-3 text-sm">${cards}</div>
    </section>`;
}

/* ============================================================

   ============================================================ */
function renderAmendments(data) {
  const noteStyle = {

    return `
      <tr style="background: ${rowBg};">

        <td class="p-3">${escapeHtml(a.year)}</td>

  return `

      ${renderSectionHeader(data)}
      <div class="overflow-x-auto rounded-xl border" style="border-color: var(--line);">

/* ============================================================
   THEME
   ============================================================ */
const themeToggle = document.getElementById('themeToggle');
function applyTheme(light) {
  document.body.classList.toggle('light-theme', light);
  themeToggle.textContent = light ? '🌙 Dark' : '☀️ Light';
  themeToggle.setAttribute('aria-label', light ? 'ডার্ক থিম চালু করুন' : 'লাইট থিম চালু করুন');
}
const savedTheme = store.get('const_theme', null);
applyTheme(savedTheme === null ? false : savedTheme);
themeToggle.addEventListener('click', () => {
  const light = !document.body.classList.contains('light-theme');
  applyTheme(light);
  store.set('const_theme', light);
});

/* ============================================================
   DIRECTORY
   ============================================================ */
let currentFilter = 'all';

function renderArticles(searchQuery = '') {
  const container = document.getElementById('articlesContainer');
  const q = searchQuery.trim().toLowerCase();
  const emptyCfg = SITE_DATA.directory;
  let total = 0;
  container.innerHTML = '';

  SITE_DATA.constitutionData.forEach(part => {
    const matches = part.articles.filter(a => {
      if (currentFilter === 'bcs-hot' && !a.bcsHot) return false;
      if (!q) return true;
      return a.num.toLowerCase().includes(q) || a.title.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q);
    });
    if (!matches.length) return;
    total += matches.length;

    const cards = matches.map(a => `
      <div class="article-card">
        <div class="flex items-center justify-between gap-2 mb-1.5 flex-wrap">
          <span class="article-num-badge">অনুচ্ছেদ ${escapeHtml(a.num)}</span>
          ${a.bcsHot ? '<span class="hot-badge">🔥 BCS Hot</span>' : ''}
        </div>
        <h4 class="font-bold text-sm mb-1" style="color: var(--txt);">${escapeHtml(a.title)}</h4>
        <p class="text-xs leading-relaxed" style="color: var(--txt-mute);">${escapeHtml(a.desc)}</p>
      </div>`).join('');

    const section = document.createElement('div');
    section.className = 'rounded-xl overflow-hidden';
    section.style.cssText = 'border:1px solid var(--line);';
    section.innerHTML = `
      <div class="part-header">
        <h3 class="font-bold text-sm sm:text-base flex items-center gap-2">
          <i data-lucide="bookmark" class="w-4 h-4 opacity-80"></i> ${escapeHtml(part.partTitle)}
        </h3>
        <span class="text-xs px-2.5 py-1 rounded-md font-medium" style="background: rgba(255,255,255,.15);">${escapeHtml(part.partRange)} · ${matches.length}টি</span>
      </div>
      <div class="p-3 grid gap-3 card-grid" style="grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); background: var(--card);">${cards}</div>`;
    container.appendChild(section);
  });

  document.getElementById('result-count').textContent = `দেখাচ্ছে: ${total} / ১৫৩`;
  if (total === 0) {
    container.innerHTML = `<div class="text-center py-12 rounded-xl" style="background: var(--card); border: 1px dashed var(--line);">
      <p class="font-medium" style="color: var(--txt);">${escapeHtml(emptyCfg.emptyTitle)}</p>
      <p class="text-xs muted mt-1">${escapeHtml(emptyCfg.emptySub)}</p>
    </div>`;
  }
  if (window.lucide) lucide.createIcons();
}

function filterArticles() {
  renderArticles(document.getElementById('articleSearch').value);
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', e => {
    currentFilter = e.currentTarget.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active-filter'));
    e.currentTarget.classList.add('active-filter');
    filterArticles();
  });
});

/* ============================================================
   PRACTICE ENGINE
   ============================================================ */
const state = {
  mode: 'flash',
  set: [], index: 0, correctCount: 0, answeredCount: 0,
  answeredThisCard: false, revealed: false,
  exam: 'bcs', kind: 'mixed', scope: 'hot', size: 20,
  known: new Set(store.get('const_known', [])),
  review: new Set(store.get('const_review', []))
};

function strategyFor(exam) {
  return {
    bcs:     { preferHot: true,  types: ['title','statement','article','article'] },
    govt:    { preferHot: false, types: ['article','title','statement'] },
    bank:    { preferHot: false, types: ['article','title','title','article'] },
    written: { preferHot: false, types: ['statement','statement','title'] }
  }[exam] || { preferHot: false, types: ['article','title','statement'] };
}

function pickConfusingDistractors(article, pool, distractorFn, count = 3) {
  const usedText = new Set([distractorFn(article)]);
  const picks = [];

  // Strategy 1: same-part distractors (much more confusing than random)
  const samePart = pool.filter(a => a.num !== article.num && a.partTitle === article.partTitle);
  for (const cand of shuffle(samePart)) {
    if (picks.length >= count) break;
    const text = distractorFn(cand);
    if (text && !usedText.has(text)) {
      picks.push(cand);
      usedText.add(text);
    }
  }

  // Strategy 2: fallback to other parts
  if (picks.length < count) {
    const others = pool.filter(a => a.num !== article.num && a.partTitle !== article.partTitle);
    for (const cand of shuffle(others)) {
      if (picks.length >= count) break;
      const text = distractorFn(cand);
      if (text && !usedText.has(text)) {
        picks.push(cand);
        usedText.add(text);
      }
    }
  }

  return picks;
}

function buildQuestion(article, pool, kind, exam) {
  if (pool.filter(a => a.num !== article.num).length < 3) return null;

  let type = kind;
  if (kind === 'mixed') {
    const strat = strategyFor(exam);
    type = strat.types[Math.floor(Math.random() * strat.types.length)];
  }

  let prompt, answer, distractorFn;
  if (type === 'article') {
    prompt = Math.random() < 0.5
      ? `"${article.title}" — এটি কোন অনুচ্ছেদ?`
      : `"${article.desc}" — এই বিধানটি কোন অনুচ্ছেদে?`;
    answer = `অনুচ্ছেদ ${article.num}`;
    distractorFn = a => `অনুচ্ছেদ ${a.num}`;
  } else if (type === 'title') {
    prompt = `অনুচ্ছেদ ${article.num} — এর শিরোনাম কোনটি?`;
    answer = article.title;
    distractorFn = a => a.title;
  } else {
    prompt = `"${article.desc}" — এই বিবরণটি কোন অনুচ্ছেদের?`;
    answer = `${article.num} — ${article.title}`;
    distractorFn = a => `${a.num} — ${a.title}`;
  }

  const distractors = pickConfusingDistractors(article, pool, distractorFn, 3);
  if (distractors.length < 3) return null;

  const options = shuffle([answer, ...distractors.map(distractorFn)]);

  return {
    article, prompt, answer, options, type,
    explanation: `অনুচ্ছেদ ${article.num}: ${article.title}। ${article.desc}`,
    partTitle: article.partTitle
  };
}

/* ==== FLASHCARD (self-check) ==== */
function buildFlashcard(article) {
  return { article, partTitle: article.partTitle };
}

/* ==== SESSION ==== */
function pickPool() {
  let pool = allArticles();
  const strat = strategyFor(state.exam);
  if (state.scope === 'hot' || strat.preferHot) {
    const hot = pool.filter(a => a.bcsHot);
    if (hot.length >= 8) pool = hot;
  }
  const fresh = pool.filter(a => !state.known.has(a.num));
  if (fresh.length >= 8) pool = fresh;
  return pool;
}

function startSession() {
  state.exam = document.getElementById('examType').value;
  state.kind = document.getElementById('questionKind').value;
  state.scope = document.getElementById('questionScope').value;
  state.size = parseInt(document.getElementById('sessionSize').value, 10);

  const pool = pickPool();
  if (pool.length < 4) {
    state.set = [];
    document.getElementById('studyCard').innerHTML = `
      <div class="eyebrow text-xs font-bold mb-2">ডেটা অপর্যাপ্ত</div>
      <h3 class="text-lg font-bold mb-2">প্রশ্ন তৈরির জন্য পর্যাপ্ত অনুচ্ছেদ নেই</h3>
      <p class="muted text-sm">অনুগ্রহ করে "সব অনুচ্ছেদ" নির্বাচন করুন বা ভিন্ন প্রশ্নের ধরন বেছে নিন।</p>`;
    return;
  }

  const picked = shuffle(pool).slice(0, Math.min(state.size, pool.length));

  if (state.mode === 'flash') {
    // Flashcard set: just the article info
    state.set = picked.map(a => buildFlashcard(a));
  } else {
    // MCQ set: build questions
    state.set = [];
    const seenKeys = new Set();
    for (const art of picked) {
      const q = buildQuestion(art, pool, state.kind, state.exam);
      if (!q) continue;
      const key = `${art.num}|${q.type}`;
      if (seenKeys.has(key)) continue;
      seenKeys.add(key);
      state.set.push(q);
      if (state.set.length >= state.size) break;
    }
    if (state.set.length < state.size) {
      const remaining = pool.filter(a => !state.set.some(q => q.article.num === a.num));
      for (const art of shuffle(remaining)) {
        const q = buildQuestion(art, pool, state.kind, state.exam);
        if (q) { state.set.push(q); if (state.set.length >= state.size) break; }
      }
    }
  }

  if (!state.set.length) return startSession();

  state.index = 0; state.correctCount = 0; state.answeredCount = 0;
  state.answeredThisCard = false; state.revealed = false;
  renderStudy();
}

/* ==== RENDER CURRENT CARD ==== */
function renderStudy() {
  const card = document.getElementById('studyCard');
  const progress = document.getElementById('studyProgress');
  const score = document.getElementById('studyScore');
  const badge = document.getElementById('studyBadge');
  const fill = document.getElementById('progressFill');
  const showAnswerBtn = document.getElementById('showAnswer');
  const markKnownBtn = document.getElementById('markKnown');
  const markReviewBtn = document.getElementById('markReview');

  if (!state.set.length) {
    progress.textContent = 'প্রস্তুত হলে শুরু করুন';
    score.textContent = 'স্কোর: ০ / ০';
    fill.style.width = '0%';
    badge.style.display = 'none';
    return;
  }

  // Show/hide contextual buttons
  if (state.mode === 'flash') {
    showAnswerBtn.style.display = '';
    markKnownBtn.style.display = '';
    markReviewBtn.style.display = '';
  } else {
    showAnswerBtn.style.display = 'none';
    markKnownBtn.style.display = 'none';
    markReviewBtn.style.display = 'none';
  }

  // Set complete
  if (state.index >= state.set.length) {
    fill.style.width = '100%';
    progress.textContent = 'সেট সম্পন্ন 🎉';
    badge.style.display = 'none';
    const acc = state.answeredCount ? Math.round((state.correctCount / state.answeredCount) * 100) : 0;
    card.innerHTML = state.mode === 'mcq' ? `
      <div class="eyebrow text-xs font-bold mb-2">সেট সম্পন্ন 🎉</div>
      <h3 class="text-2xl font-bold mb-3">স্কোর ${state.correctCount} / ${state.answeredCount}</h3>
      <p class="mb-1" style="color: var(--txt);">নির্ভুলতা: <strong style="color: var(--accent-txt);">${acc}%</strong></p>
      <p class="muted text-sm mb-4">${state.correctCount === state.answeredCount ? 'অসাধারণ! আরও কঠিন প্রশ্নের জন্য প্রস্তুত।' : 'ভুল প্রশ্নগুলোর অনুচ্ছেদ ডিরেক্টরি থেকে আবার পড়ুন।'}</p>
      <button class="action-btn px-4 py-2 rounded-lg font-bold self-start" onclick="startSession()">🔄 আবার নতুন সেট</button>
    ` : `
      <div class="eyebrow text-xs font-bold mb-2">সেট সম্পন্ন 🎉</div>
      <h3 class="text-2xl font-bold mb-3">${state.set.length}টি কার্ড দেখা হয়েছে</h3>
      <p class="muted text-sm mb-4">ভালো করছেন! আরও প্র্যাকটিস করুন।</p>
      <button class="action-btn px-4 py-2 rounded-lg font-bold self-start" onclick="startSession()">🔄 আবার নতুন সেট</button>
    `;
    score.textContent = state.mode === 'mcq'
      ? `স্কোর: ${state.correctCount} / ${state.answeredCount}`
      : `প্রোগ্রেস: ${state.set.length} / ${state.set.length}`;
    return;
  }

  const item = state.set[state.index];
  const total = state.set.length;
  const filled = state.index + (state.answeredThisCard || (state.mode === 'flash' && state.revealed) ? 1 : 0);
  fill.style.width = `${(filled / total) * 100}%`;
  progress.textContent = state.mode === 'mcq'
    ? `প্রশ্ন ${state.index + 1} / ${total}`
    : `কার্ড ${state.index + 1} / ${total}`;
  score.textContent = state.mode === 'mcq'
    ? `স্কোর: ${state.correctCount} / ${state.answeredCount}`
    : `প্রোগ্রেস: ${state.index + 1} / ${total}`;
  badge.style.display = 'inline-block';
  badge.textContent = `📘 ${state.exam.toUpperCase()} · ${item.partTitle.split(':')[0]}`;

  if (state.mode === 'flash') {
    renderFlashcard(item);
  } else {
    renderMcq(item);
  }
}

/* ==== FLASHCARD RENDER (self-check) ==== */
function renderFlashcard(item) {
  const card = document.getElementById('studyCard');
  const a = item.article;
  card.innerHTML = `
    <div class="eyebrow text-xs font-bold mb-2">FLASHCARD · ${escapeHtml(item.partTitle)}</div>
    <div class="flash-face">
      <div class="flash-num-badge">📖 অনুচ্ছেদ ${escapeHtml(a.num)}</div>
      <h3 class="flash-title">${escapeHtml(a.title)}</h3>
      ${state.revealed
        ? `<div class="flash-answer">
             <div class="flash-answer-label">বিবরণ</div>
             <p class="flash-answer-text">${escapeHtml(a.desc)}</p>
           </div>`
        : `<p class="muted text-sm mt-2">আপনি কি এই অনুচ্ছেদের বিস্তারিত জানেন?<br>ভেবে দেখুন, তারপর <strong style="color: var(--accent-txt);">"👁 উত্তর দেখুন"</strong> চাপুন।</p>`}
    </div>
  `;
}

/* ==== MCQ RENDER (exam-style) ==== */
function renderMcq(q) {
  const card = document.getElementById('studyCard');
  card.innerHTML = `
    <div class="eyebrow text-xs font-bold mb-2">MCQ · ${escapeHtml(q.partTitle)}</div>
    <h3 class="text-base sm:text-xl font-bold mb-4">${escapeHtml(q.prompt)}</h3>
    <div id="answerOptions">
      ${q.options.map((opt, i) => `
        <button type="button" class="answer-option" data-opt="${i}">
          <span class="font-bold mr-2" style="color: var(--accent-txt);">${['ক','খ','গ','ঘ'][i]}.</span>${escapeHtml(opt)}
        </button>`).join('')}
    </div>
    <div id="mcqFeedback" class="mt-3" aria-live="polite"></div>`;
}

/* ==== MCQ ANSWER HANDLER ==== */
function handleMcqAnswer(idx) {
  if (state.answeredThisCard) return;
  const q = state.set[state.index];
  if (!q || !q.options) return;
  const card = document.getElementById('studyCard');
  const options = card.querySelectorAll('[data-opt]');
  const chosen = q.options[idx];
  const correct = chosen === q.answer;

  state.answeredThisCard = true;
  state.answeredCount++;
  if (correct) state.correctCount++;

  options.forEach(b => {
    b.disabled = true;
    const val = q.options[parseInt(b.dataset.opt, 10)];
    if (val === q.answer) b.classList.add('correct');
    else if (parseInt(b.dataset.opt, 10) === idx) b.classList.add('wrong');
  });

  const fb = document.getElementById('mcqFeedback');
  fb.innerHTML = `
    <div class="mcq-feedback ${correct ? 'ok' : 'no'}">
      <p class="font-bold mb-1">${correct ? '✓ সঠিক উত্তর!' : '✗ সঠিক হয়নি'}</p>
      <p class="text-sm" style="color: var(--txt);">${escapeHtml(q.explanation)}</p>
    </div>`;
  document.getElementById('studyScore').textContent = `স্কোর: ${state.correctCount} / ${state.answeredCount}`;
  document.getElementById('progressFill').style.width = `${((state.index + 1) / state.set.length) * 100}%`;
}

/* ==== NAVIGATION ==== */
function nextCard() {
  if (!state.set.length) return;
  state.index++;
  state.answeredThisCard = false;
  state.revealed = false;
  renderStudy();
}
function prevCard() {
  if (!state.set.length || state.index === 0) return;
  state.index--;
  state.answeredThisCard = false;
  state.revealed = false;
  renderStudy();
}
function revealAnswer() {
  if (!state.set.length || state.index >= state.set.length) return;
  if (state.mode !== 'flash') return;
  state.revealed = true;
  renderStudy();
}

/* ==== BUTTON WIRING ==== */
document.getElementById('modeFlash').addEventListener('click', () => {
  state.mode = 'flash';
  document.getElementById('modeFlash').classList.add('active');
  document.getElementById('modeMcq').classList.remove('active');
  // Reset session
  state.set = []; state.index = 0; state.correctCount = 0; state.answeredCount = 0;
  state.answeredThisCard = false; state.revealed = false;
  renderStudy();
  document.getElementById('studyCard').innerHTML = `
    <div class="eyebrow text-xs font-bold mb-2">FLASHCARD মোড</div>
    <h3 class="text-lg font-bold mb-2">Random অনুচ্ছেদ আসবে</h3>
    <p class="muted text-sm">"▶ নতুন সেট" চাপুন। প্রতিটি কার্ডে অনুচ্ছেদ নম্বর + শিরোনাম দেখাবে। "👁 উত্তর দেখুন" দিয়ে বিবরণ দেখুন, তারপর নিজেকে যাচাই করুন।</p>`;
});
document.getElementById('modeMcq').addEventListener('click', () => {
  state.mode = 'mcq';
  document.getElementById('modeMcq').classList.add('active');
  document.getElementById('modeFlash').classList.remove('active');
  // Reset session
  state.set = []; state.index = 0; state.correctCount = 0; state.answeredCount = 0;
  state.answeredThisCard = false; state.revealed = false;
  renderStudy();
  document.getElementById('studyCard').innerHTML = `
    <div class="eyebrow text-xs font-bold mb-2">MCQ মোড (EXAM-STYLE)</div>
    <h3 class="text-lg font-bold mb-2">৪ অপশনের standard MCQ</h3>
    <p class="muted text-sm">"▶ নতুন সেট" চাপুন। প্রতিটি প্রশ্নে ৪টি অপশন থাকবে (same-part distractors → বেশি confusing)। একটি সাবমিট করুন, সাথে সাথে feedback পাবেন।</p>`;
});
document.getElementById('startStudy').addEventListener('click', startSession);
document.getElementById('prevQuestion').addEventListener('click', prevCard);
document.getElementById('nextQuestion').addEventListener('click', nextCard);
document.getElementById('showAnswer').addEventListener('click', revealAnswer);
document.getElementById('markKnown').addEventListener('click', () => {
  if (!state.set.length || state.index >= state.set.length) return;
  const item = state.set[state.index];
  state.known.add(item.article.num);
  state.review.delete(item.article.num);
  store.set('const_known', Array.from(state.known));
  store.set('const_review', Array.from(state.review));
  nextCard();
});
document.getElementById('markReview').addEventListener('click', () => {
  if (!state.set.length || state.index >= state.set.length) return;
  const item = state.set[state.index];
  state.review.add(item.article.num);
  state.known.delete(item.article.num);
  store.set('const_known', Array.from(state.known));
  store.set('const_review', Array.from(state.review));
  nextCard();
});

/* ==== DELEGATED ANSWER CLICKS ==== */
document.getElementById('studyCard').addEventListener('click', e => {
  const btn = e.target.closest('[data-opt]');
  if (btn && state.mode === 'mcq') handleMcqAnswer(parseInt(btn.dataset.opt, 10));
});

/* ==== KEYBOARD ==== */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (!state.set.length) return;
  if (e.key === ' ' && state.mode === 'flash') { e.preventDefault(); revealAnswer(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); nextCard(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevCard(); }
  else if (state.mode === 'mcq' && /^[1-4]$/.test(e.key)) {
    const idx = parseInt(e.key, 10) - 1;
    const q = state.set[state.index];
    if (q && q.options && idx < q.options.length) handleMcqAnswer(idx);
  }
});

/* ==== INIT ==== */
function init() {
  if (window.lucide) lucide.createIcons();
  renderArticles();
}
if (document.readyState !== 'loading') init();
else window.addEventListener('DOMContentLoaded', init);
</script>
