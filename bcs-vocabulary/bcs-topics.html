<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BCS Topics – Persistent Tab</title>

    <!-- ⭐ থিম ফ্ল্যাশ ঠিক করতে হেডের শুরুতে ইনলাইন স্ক্রিপ্ট -->
    <script>
        (function () {
            const stored = localStorage.getItem('theme');
            let isDark = null;
            if (stored === 'dark') isDark = true;
            else if (stored === 'light') isDark = false;
            if (isDark === null) {
                isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"] },
                    animation: {
                        'fade-in': 'fadeIn 0.3s ease-in-out',
                        'slide-in': 'slideIn 0.3s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        slideIn: {
                            '0%': { opacity: '0', transform: 'translateX(-20px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' }
                        }
                    }
                }
            }
        };
    </script>

    <!-- External CSS -->
    <link rel="stylesheet" href="./assets/css/topics.css" />

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">
    </script>
</head>

<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors font-sans">

    <!-- Header -->
    <header
        class="sticky top-0 z-40 border-b border-slate-200/80 dark:border-slate-700/80 bg-white/95 dark:bg-slate-800/95 backdrop-blur-lg shadow-sm">
        <div class="container-2xl px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <button id="menuToggle"
                    class="lg:hidden p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
                <div
                    class="h-10 w-10 rounded-xl bg-gradient-to-br from-indigo-600 to-purple-600 text-white flex items-center justify-center font-bold text-lg shadow-lg flex-shrink-0">
                    B</div>
                <div>
                    <h1
                        class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                        BCS Topics</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Study Materials</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="/jobniyog"
                    class="hidden sm:flex items-center gap-2 rounded-xl bg-indigo-600 px-4 py-2 text-sm font-semibold text-white hover:bg-indigo-700 transition">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1m-2 0h2" />
                    </svg>
                    Home
                </a>
                <button id="themeToggle"
                    class="rounded-xl p-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                    <span id="themeIcon" class="text-slate-600 dark:text-slate-300">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Mobile Overlay -->
    <div id="mobileOverlay" class="fixed inset-0 z-30 bg-black/50 backdrop-blur-sm hidden lg:hidden"
        onclick="closeMobileMenu()"></div>

    <!-- Main -->
    <div class="container-2xl px-4 py-6">
        <div class="flex gap-6 relative">

            <!-- Sidebar -->
            <aside id="sidebar" class="lg:w-72 xl:w-80 flex-shrink-0">
                <div class="sticky top-20 max-h-[calc(100vh-6rem)] overflow-y-auto sidebar-scroll">
                    <div
                        class="rounded-2xl border border-slate-200/80 dark:border-slate-700/80 bg-white/80 dark:bg-slate-800/80 p-4 shadow-sm backdrop-blur-sm">
                        <div class="flex items-center justify-between mb-4">
                            <h2 class="text-sm font-bold text-slate-700 dark:text-slate-300">📚 Topics</h2>
                            <span id="topicCount"
                                class="text-xs bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-400 px-2 py-0.5 rounded-full font-semibold">0</span>
                        </div>
                        <div class="relative mb-4">
                            <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400" fill="none"
                                stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                            </svg>
                            <input id="searchInput" type="text" placeholder="Filter topics..."
                                class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 pl-9 pr-4 py-2 text-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:focus:ring-indigo-900" />
                        </div>
                        <div id="topicsList" class="space-y-1"></div>
                        <div id="sidebarLoading" class="text-center py-8">
                            <div
                                class="inline-block animate-spin rounded-full h-5 w-5 border-2 border-indigo-500 border-t-transparent">
                            </div>
                            <p class="mt-2 text-xs text-slate-400">Loading...</p>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Mobile Sidebar -->
            <div id="mobileSidebar"
                class="fixed inset-y-0 left-0 z-40 w-72 bg-white dark:bg-slate-800 transform -translate-x-full transition-transform duration-300 lg:hidden shadow-xl">
                <div class="p-4 h-full overflow-y-auto sidebar-scroll">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-sm font-bold text-slate-700 dark:text-slate-300">📚 Topics</h2>
                        <button onclick="closeMobileMenu()"
                            class="p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700">
                            <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M6 18L18 6M6 6l12 12" />
                            </svg>
                        </button>
                    </div>
                    <div class="relative mb-4">
                        <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-400" fill="none"
                            stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <input id="mobileSearchInput" type="text" placeholder="Filter topics..."
                            class="w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 pl-9 pr-4 py-2 text-sm outline-none focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 dark:focus:ring-indigo-900" />
                    </div>
                    <div id="mobileTopicsList" class="space-y-1"></div>
                </div>
            </div>

            <!-- Main Content -->
            <main class="flex-1 min-w-0">
                <!-- Empty State -->
                <div id="emptyState"
                    class="rounded-2xl border border-slate-200/80 dark:border-slate-700/80 bg-white/80 dark:bg-slate-800/80 p-12 shadow-sm text-center">
                    <div class="max-w-md mx-auto">
                        <div
                            class="h-20 w-20 mx-auto rounded-2xl bg-gradient-to-br from-indigo-100 to-purple-100 dark:from-indigo-900/30 dark:to-purple-900/30 flex items-center justify-center text-4xl mb-4">
                            📖</div>
                        <h3 class="text-xl font-bold text-slate-700 dark:text-slate-300">Select a Topic</h3>
                        <p class="mt-2 text-slate-500 dark:text-slate-400 text-sm">Choose a topic from the sidebar to
                            start studying.</p>
                        <div class="mt-6 flex flex-wrap justify-center gap-2">
                            <span
                                class="px-3 py-1 bg-indigo-50 dark:bg-indigo-900/30 text-indigo-600 dark:text-indigo-400 rounded-full text-xs">📚
                                10+ Topics</span>
                            <span
                                class="px-3 py-1 bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-400 rounded-full text-xs">✅
                                Exam Ready</span>
                            <span
                                class="px-3 py-1 bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-400 rounded-full text-xs">🎯
                                BCS Focused</span>
                        </div>
                    </div>
                </div>

                <!-- Content View -->
                <div id="contentView" class="hidden">
                    <div
                        class="rounded-2xl border border-slate-200/80 dark:border-slate-700/80 bg-white/80 dark:bg-slate-800/80 p-6 shadow-sm">
                        <div id="contentHeader" class="flex items-start justify-between gap-4 mb-4">
                            <div>
                                <div id="contentBadge" class="inline-block mb-2"></div>
                                <h3 id="contentTitle" class="text-xl font-bold text-slate-800 dark:text-slate-200"></h3>
                            </div>
                            <button id="backBtn"
                                class="lg:hidden flex items-center gap-2 text-sm text-indigo-600 hover:text-indigo-700 dark:text-indigo-400">←
                                Back</button>
                        </div>
                        <div id="contentBody" class="content-fade"></div>
                    </div>
                </div>
            </main>

        </div>
    </div>

    <!-- External JavaScript -->
    <script src="./assets/js/topics.js"></script>
</body>

</html>
