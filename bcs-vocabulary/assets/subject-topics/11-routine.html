        function initTaskManager() {
            const STORAGE_KEY = 'bcs_daily_tasks_local';

            const DEFAULT_TASKS = [
                '📝 5টি নতুন ইংরেজি শব্দ (synonym, antonym, meaning)',
                '📖 English Literature: One Term or Writer',
                '📘 Daily Grammar (BCS focus) – at least one topic',
                '📰 Daily Newspaper Read',
                '🎯 Live MCQ Practice',
                '📝 1 Model Test (from previous BCS) at office',
                '📚 Monthly Affairs Read from Uttoron',
                '🖥️ Dynamic Panel Content Regular Check from Live MCQ',
            ];

            let tasks = [];
            let lastResetDate = null;
            let listenersAttached = false;

            // ── helpers ──
            function getDhakaDate() {
                const now = new Date();
                const dhakaTime = new Date(now.getTime() + (6 * 60 * 60 * 1000));
                return dhakaTime.toISOString().split('T')[0];
            }

            function generateId() {
                return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 6);
            }

            function loadFromLocal() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        return parsed;
                    }
                } catch (_) { return null; }
                return null;
            }

            function saveToLocal(data) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ── core logic ──
            function mergeAndReset(localData) {
                const today = getDhakaDate();
                let mergedTasks = [];
                let resetNeeded = false;

                if (localData && localData.tasks && localData.tasks.length > 0) {
                    mergedTasks = localData.tasks;
                    lastResetDate = localData.lastReset || null;
                } else {
                    mergedTasks = DEFAULT_TASKS.map(text => ({ id: generateId(), text, done: false }));
                    lastResetDate = null;
                    resetNeeded = true;
                }

                // Daily reset: uncheck all, keep tasks
                if (lastResetDate !== today) {
                    mergedTasks = mergedTasks.map(t => ({ ...t, done: false }));
                    lastResetDate = today;
                    resetNeeded = true;
                }

                if (resetNeeded) {
                    saveToLocal({ tasks: mergedTasks, lastReset: lastResetDate });
                }

                return { tasks: mergedTasks, lastReset: lastResetDate };
            }

            function renderTasks() {
                const container = document.getElementById('taskList');
                if (!container) return;

                if (tasks.length === 0) {
                    container.innerHTML =
                        `<div class="text-center text-slate-400 dark:text-slate-500 py-4 italic">🎯 কোনো কাজ নেই। উপরে নতুন কাজ যোগ করুন!</div>`;
                    updateStats();
                    return;
                }

                let html = '';
                tasks.forEach((task) => {
                    const checked = task.done ? 'checked' : '';
                    const labelClass = task.done ? 'task-label checked line-through opacity-60' : 'task-label';
                    html += `
                        <div class="task-item flex items-center gap-3 bg-slate-50 dark:bg-slate-800/60 px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700/70 transition" data-task-id="${task.id}">
                            <input type="checkbox" class="task-checkbox w-5 h-5 accent-teal-600 cursor-pointer flex-shrink-0" ${checked} />
                            <span class="flex-1 text-sm md:text-base font-medium text-slate-700 dark:text-slate-200 ${labelClass}">${escapeHtml(task.text)}</span>
                            <button class="task-delete text-slate-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-900/30 p-1.5 rounded-lg transition" title="Delete">✕</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
                updateStats();
            }

            function updateStats() {
                const total = tasks.length;
                const done = tasks.filter(t => t.done).length;
                const countEl = document.getElementById('taskCount');
                const progressEl = document.getElementById('taskProgress');
                if (countEl) countEl.textContent = `${done}/${total}`;
                if (progressEl) {
                    const pct = total === 0 ? 0 : Math.round((done / total) * 100);
                    progressEl.style.width = pct + '%';
                }
            }

            function updateSyncStatus(msg, isSuccess = null) {
                const el = document.getElementById('syncStatus');
                if (el) {
                    el.textContent = msg;
                    el.className = 'text-xs ' + (isSuccess === true ? 'text-green-600 dark:text-green-400' :
                        isSuccess === false ? 'text-red-500 dark:text-red-400' : 'text-slate-500 dark:text-slate-400');
                }
            }

            function saveAndRender() {
                saveToLocal({ tasks, lastReset: getDhakaDate() });
                renderTasks();
                updateSyncStatus('✅ সংরক্ষিত', true);
            }

            // ── actions ──
            function deleteTaskById(id) {
                const stringId = String(id);
                const idx = tasks.findIndex(t => String(t.id) === stringId);
                if (idx === -1) {
                    updateSyncStatus('⚠️ কাজটি খুঁজে পাওয়া যায়নি', false);
                    return;
                }
                const text = tasks[idx].text;
                if (confirm(`"${text}" – কাজটি মুছতে চান?`)) {
                    tasks.splice(idx, 1);
                    saveAndRender();
                    updateSyncStatus(`✅ "${text}" মুছে ফেলা হয়েছে`, true);
                }
            }

            function toggleTaskById(id) {
                const stringId = String(id);
                const task = tasks.find(t => String(t.id) === stringId);
                if (!task) {
                    updateSyncStatus('⚠️ কাজটি খুঁজে পাওয়া যায়নি', false);
                    return;
                }
                task.done = !task.done;
                saveAndRender();
            }

            function addTask() {
                const input = document.getElementById('taskInput');
                const text = input.value.trim();
                if (text === '') {
                    updateSyncStatus('⚠️ দয়া করে কাজটি লিখুন', false);
                    return;
                }
                tasks.push({ id: generateId(), text, done: false });
                saveAndRender();
                input.value = '';
                input.focus();
                updateSyncStatus('✅ কাজ যোগ করা হয়েছে', true);
            }

            function resetAllTasks() {
                if (tasks.length === 0) {
                    updateSyncStatus('ℹ️ কোনো কাজ নেই', false);
                    return;
                }
                if (confirm('⚠️ সব কাজ মুছে ডিফল্ট কাজ পুনরুদ্ধার করবেন?')) {
                    tasks = DEFAULT_TASKS.map(text => ({ id: generateId(), text, done: false }));
                    saveAndRender();
                    updateSyncStatus('✅ ডিফল্ট কাজ পুনরুদ্ধার করা হয়েছে', true);
                }
            }

            function clearCompletedTasks() {
                const doneCount = tasks.filter(t => t.done).length;
                if (doneCount === 0) {
                    updateSyncStatus('ℹ️ কোনো সম্পন্ন কাজ নেই', false);
                    return;
                }
                if (confirm(`✔️ ${doneCount}টি সম্পন্ন কাজ মুছবেন?`)) {
                    tasks = tasks.filter(t => !t.done);
                    saveAndRender();
                    updateSyncStatus(`✅ ${doneCount}টি সম্পন্ন কাজ মুছে ফেলা হয়েছে`, true);
                }
            }

            // ── event delegation ──
            function setupEventDelegation() {
                if (listenersAttached) return;
                const container = document.getElementById('taskList');
                if (!container) return;

                // Checkbox: use 'change' event (reliable)
                container.addEventListener('change', function (e) {
                    const checkbox = e.target.closest('.task-checkbox');
                    if (!checkbox) return;
                    const item = checkbox.closest('.task-item');
                    if (!item) return;
                    const id = item.dataset.taskId;
                    if (!id) return;
                    // Update the task's done state
                    const stringId = String(id);
                    const task = tasks.find(t => String(t.id) === stringId);
                    if (task) {
                        task.done = checkbox.checked;
                        saveAndRender();
                    }
                    e.stopPropagation();
                });

                // Delete button: use 'click' event
                container.addEventListener('click', function (e) {
                    const deleteBtn = e.target.closest('.task-delete');
                    if (!deleteBtn) return;
                    const item = deleteBtn.closest('.task-item');
                    if (!item) return;
                    const id = item.dataset.taskId;
                    if (!id) return;
                    e.preventDefault();
                    deleteTaskById(id);
                    e.stopPropagation();
                });

                listenersAttached = true;
            }

            // ── init ──
            function init() {
                const localData = loadFromLocal();
                const result = mergeAndReset(localData);
                tasks = result.tasks;
                lastResetDate = result.lastReset;

                renderTasks();
                setupEventDelegation();
                updateSyncStatus('✅ প্রস্তুত', true);

                const addBtn = document.getElementById('addTaskBtn');
                const input = document.getElementById('taskInput');
                if (addBtn && input) {
                    addBtn.addEventListener('click', addTask);
                    input.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') addTask();
                    });
                }

                const resetBtn = document.getElementById('resetAllBtn');
                if (resetBtn) resetBtn.addEventListener('click', resetAllTasks);

                const clearBtn = document.getElementById('clearDoneBtn');
                if (clearBtn) clearBtn.addEventListener('click', clearCompletedTasks);
            }

            init();
        }

        // ──────────────────────────────────────────────────────────────
        // 4. DARK MODE SYNC (unchanged)
        // ──────────────────────────────────────────────────────────────
        (function syncTheme() {
            function applyTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }

            let stored = localStorage.getItem('theme');
            let isDark = null;

            if (stored === 'dark') isDark = true;
            else if (stored === 'light') isDark = false;

            if (isDark === null) {
                isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            applyTheme(isDark);

            window.addEventListener('message', function (e) {
                if (e.data && typeof e.data.theme === 'string') {
                    applyTheme(e.data.theme === 'dark');
                    localStorage.setItem('theme', e.data.theme);
                }
            });
        })();

        // ──────────────────────────────────────────────────────────────
        // 5. BOOT
        // ──────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            renderSchedule(scheduleData);
        });
    </script>
</body>
