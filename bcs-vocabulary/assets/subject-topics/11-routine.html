    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f4f7fc;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            transition: background 0.3s, color 0.3s;
        }

        .container {
            max-width: 1300px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.12);
            padding: 2.5rem 2rem 3rem;
            transition: background 0.3s, box-shadow 0.3s;
        }

        /* ── Headings ── */
        .main-title {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: #0b2b3c;
            margin-bottom: 0.1rem;
            transition: color 0.3s;
        }

        .main-title span {
            background: linear-gradient(145deg, #1a5a7a, #0f3b52);
            color: #fff;
            padding: 0.1rem 1.2rem;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 600;
            margin-left: 0.4rem;
            display: inline-block;
            transition: background 0.3s;
        }

        .section-head {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a3a4a;
            margin: 2.2rem 0 1rem 0;
            padding-left: 0.5rem;
            border-left: 6px solid #1f7a8c;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.3s, border-color 0.3s;
        }

        .section-head small {
            font-weight: 400;
            font-size: 0.9rem;
            color: #4f6f7f;
            background: #eaf0f5;
            padding: 0.1rem 1rem;
            border-radius: 20px;
            transition: background 0.3s, color 0.3s;
        }

        /* ── Table Wrapper ── */
        .table-wrap {
            overflow-x: auto;
            margin: 0.5rem 0 1.8rem 0;
            border-radius: 18px;
            border: 1px solid #e6edf4;
            background: #fafcff;
            transition: border-color 0.3s, background 0.3s;
        }

        .routine-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
            min-width: 720px;
            table-layout: fixed;
        }

        .routine-table thead th {
            background: #1f4a5e;
            color: #ffffff;
            font-weight: 600;
            padding: 14px 10px;
            text-align: center;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            border-right: 1px solid #2f5f73;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        .routine-table thead th:last-child {
            border-right: none;
        }

        .routine-table tbody td {
            padding: 12px 8px;
            text-align: center;
            vertical-align: middle;
            border-bottom: 1px solid #e2eaf2;
            border-right: 1px solid #e2eaf2;
            background-color: #ffffff;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
            line-height: 1.6;
        }

        .routine-table tbody td:last-child {
            border-right: none;
        }

        .routine-table tbody tr:last-child td {
            border-bottom: none;
        }

        .day-cell {
            font-weight: 700;
            color: #0b2b3c;
            background: #f0f5fa !important;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
            width: 110px;
            min-width: 100px;
            transition: background 0.3s, color 0.3s;
        }

        .subject-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 100%;
        }

        .subject-item {
            display: inline-block;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 0.82rem;
            letter-spacing: 0.2px;
            line-height: 1.7;
            white-space: nowrap;
            transition: background 0.3s, color 0.3s;
        }

        .plus-sep {
            display: block;
            font-size: 1.1rem;
            font-weight: 300;
            color: #7f9aa8;
            line-height: 0.8;
            padding: 1px 0;
            text-align: center;
            width: 100%;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        /* ── LIGHT THEME SUBJECT COLOURS ── */
        .subj-english-grammar {
            background: #dbeaf5;
            color: #0e4b6e;
        }

        .subj-english-lit {
            background: #f2dce8;
            color: #7a2b5a;

        .subj-math {

        .subj-bangla-lit {

        .subj-science {
            background: #d6e2f0;
            color: #1f4f7a;
        }

        .subj-computer {
            background: #dfdbe8;

        }

        .subj-geography {
            background: #d4ede6;
            color: #1a6b4f;
        }

        .subj-ethics {
            background: #ead3c4;
            color: #7a4a2a;
        }

        .subj-mental {
            background: #e0d9f0;
            color: #5a3d7a;
        }

        .subj-news {
            background: #f5ebd2;
            color: #8a6a2a;
        }

        .subj-revision {
            background: #fad4d4;
            color: #8a2a2a;
        }

        .subj-mcq {
            background: #f5d4e8;
            color: #7a3a5a;
        }

        /* ── Footer ── */
        .footer-note {
            text-align: center;
            margin-top: 2.5rem;
            padding-top: 1.8rem;
            border-top: 2px dashed #d3e0e9;
            transition: border-color 0.3s;
        }

        .footer-note .tagline {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1a4a5a;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.8rem 2rem;
            transition: color 0.3s;
        }

        .footer-note .tagline span {
            background: #eaf1f8;
            padding: 0.2rem 1.4rem;
            border-radius: 40px;
            font-weight: 500;
            color: #1f5a6a;
            font-size: 0.95rem;
            transition: background 0.3s, color 0.3s;
        }

        /* ── DAILY TASK MANAGER ── */
        .task-section {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 3px solid #e2e8f0;
            transition: border-color 0.3s;
        }

        .task-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .task-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1a3a4a;
            transition: color 0.3s;
        }

        .task-stats {
            display: flex;
            gap: 1rem;
            align-items: center;
            font-size: 0.9rem;
            color: #4f6f7f;
            transition: color 0.3s;
        }

        .task-stats span {
            background: #eaf0f5;
            padding: 0.2rem 0.8rem;
            border-radius: 30px;
            transition: background 0.3s, color 0.3s;
        }

        .progress-bar {
            width: 150px;
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            transition: background 0.3s;
        }

        .progress-fill {
            height: 100%;
            background: #4f8a9c;
            transition: width 0.4s ease;
            border-radius: 10px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            margin-bottom: 1.5rem;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: #f8fafc;
            padding: 0.7rem 1.2rem;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            transition: background 0.3s, border-color 0.3s, opacity 0.3s;
        }

        .task-item:hover {
            background: #f1f5f9;
        }

        .task-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #1f7a8c;
            cursor: pointer;
            flex-shrink: 0;
        }

        .task-item .task-label {
            flex: 1;
            font-size: 1rem;
            font-weight: 500;
            color: #1e293b;
            transition: color 0.3s;
        }

        .task-item .task-label.checked {
            text-decoration: line-through;
            opacity: 0.6;
        }

        .task-item .task-delete {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0 0.3rem;
            transition: color 0.2s;
            line-height: 1;
        }

        .task-item .task-delete:hover {
            color: #e53e3e;
        }

        .task-add-form {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }

        .task-add-form input {
            flex: 1;
            min-width: 200px;
            padding: 0.7rem 1.2rem;
            border: 1px solid #e2e8f0;
            border-radius: 30px;
            font-size: 0.95rem;
            background: #fff;
            transition: background 0.3s, border-color 0.3s, color 0.3s;
            outline: none;
        }

        .task-add-form input:focus {
            border-color: #1f7a8c;
            box-shadow: 0 0 0 3px rgba(31, 122, 140, 0.2);
        }

        .task-add-form button {
            padding: 0.7rem 1.8rem;
            background: #1f7a8c;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }

        .task-add-form button:hover {
            background: #166072;
        }

        .task-add-form button:active {
            transform: scale(0.96);
        }

        .sync-status {
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 0.5rem;
            text-align: right;
            transition: color 0.3s;
        }

        .sync-status.error {
            color: #e53e3e;
        }

        .sync-status.success {
            color: #38a169;
        }

        // ──────────────────────────────────────────────────────────────

        // ──────────────────────────────────────────────────────────────
        // 3. RENDER SCHEDULE
        // ──────────────────────────────────────────────────────────────
        function renderSchedule(data) {
            const app = document.getElementById('app');

            html += `<div class="main-title">${data.title} <span>${data.version}</span></div>`;

            data.sections.forEach((section) => {
                html += `<div class="section-head">${section.title} <small>${section.subtitle}</small></div>`;

                html += `<thead><tr>`;
                section.headers.forEach((header) => {
                    html += `<th>${header}</th>`;
                });
                html += `</tr></thead>`;
                html += `<tbody>`;
                section.rows.forEach((row) => {
                    html += `<tr>`;
                    html += `<td class="day-cell">${row.day}</td>`;
                    row.cells.forEach((cell) => {
                        html += `<td><div class="subject-block">`;
                        cell.forEach((subject, index) => {
                            const colorClass = subjectColorMap[subject] || '';
                            html += `<span class="subject-item ${colorClass}">${subject}</span>`;
                            if (index < cell.length - 1) {
                                html += `<span class="plus-sep">+</span>`;
                            }
                        });
                        html += `</div></td>`;
                    });
                    html += `</tr>`;
                });
                html += `</tbody></table></div>`;
            });

            // Footer
            html += `
                <div class="footer-note">

                        <span>🔄 Revision</span>

                    </div>
                </div>
            `;

            // ── TASK MANAGER ──
            html += `
                <div class="task-section" id="taskSection">
                    <div class="task-header">
                        <h2>📋 আমার দৈনিক কাজ</h2>
                        <div class="task-stats">
                            <span id="taskCount">0/0</span>
                            <div class="progress-bar">
                                <div id="taskProgress" class="progress-fill" style="width:0%"></div>
                            </div>
                        </div>
                    </div>
                    <div id="taskList" class="task-list">
                        <!-- Tasks will be rendered here -->
                    </div>
                    <div class="task-add-form">
                        <input type="text" id="taskInput" placeholder="নতুন কাজ যোগ করুন (বাংলা/ইংরেজি)" />

                    <div id="syncStatus" class="sync-status">🔄 Syncing...</div>

            // After rendering, initialise the task manager
            initTaskManager();

        // ──────────────────────────────────────────────────────────────
        // 4. TASK MANAGER (Cross-device with JSONsilo + localStorage fallback)
        // ──────────────────────────────────────────────────────────────
        function initTaskManager() {
            const STORAGE_KEY = 'bcs_daily_tasks_local';
            let tasks = [];
            let lastResetDate = null;

            // ---- Helper: get Dhaka date (YYYY-MM-DD) ----
            function getDhakaDate() {
                const now = new Date();
                const dhakaTime = new Date(now.getTime() + (6 * 60 * 60 * 1000));
                return dhakaTime.toISOString().split('T')[0];
            }

            // ---- Load from JSONsilo (PUBLIC endpoint) ----
            async function loadFromJSONSilo() {
                if (!USE_JSONSILO || !JSONSILO_CONFIG.BIN_ID) {
                    return null;
                }
                try {
                    const response = await fetch(`https://api.jsonsilo.com/public/${JSONSILO_CONFIG.BIN_ID}`, {
                        headers: { 'Content-Type': 'application/json' }
                    });
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    const data = await response.json();
                    return data; // should contain { tasks, lastReset }
                } catch (e) {
                    console.warn('JSONsilo load error:', e);
                    return null;
                }
            }

            // ---- Save to JSONsilo (MANAGE API with X-MAN-API) ----
            async function saveToJSONSilo(data) {
                if (!USE_JSONSILO || !JSONSILO_CONFIG.BIN_ID || !JSONSILO_CONFIG.API_KEY) {
                    return false;
                }
                try {
                    const response = await fetch(`https://api.jsonsilo.com/api/v1/manage/${JSONSILO_CONFIG.BIN_ID}`, {
                        method: 'PATCH',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-MAN-API': JSONSILO_CONFIG.API_KEY
                        },
                        body: JSON.stringify(data)
                    });
                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`HTTP ${response.status} - ${errText}`);
                    }
                    return true;
                } catch (e) {
                    console.warn('JSONsilo save error:', e);
                    return false;
                }
            }

            // ---- Load from localStorage ----
            function loadFromLocal() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        return parsed;
                    }
                } catch (e) { }
                return null;
            }

            // ---- Save to localStorage ----
            function saveToLocal(data) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            }

            // ---- Merge & reset logic ----
            function mergeAndReset(cloudData, localData) {
                const today = getDhakaDate();
                let mergedTasks = [];
                let resetNeeded = false;

                // If cloud exists, use cloud as primary
                if (cloudData && cloudData.tasks && cloudData.tasks.length > 0) {
                    mergedTasks = cloudData.tasks;
                    lastResetDate = cloudData.lastReset || null;
                } else if (localData && localData.tasks && localData.tasks.length > 0) {
                    // fallback to local
                    mergedTasks = localData.tasks;
                    lastResetDate = localData.lastReset || null;
                } else {
                    // default tasks
                    const defaultTasks = [
                        '📝 5টি নতুন ইংরেজি শব্দ (synonym, antonym, meaning)',
                        '📖 English Literature: One Term or Writer',
                        '📘 Daily Grammar (BCS focus) – at least one topic',
                        '📰 Daily Newspaper Read',
                        '🎯 Live MCQ Practice',
                        '📝 1 Model Test (from previous BCS) at office'
                    ];
                    mergedTasks = defaultTasks.map(text => ({ id: Date.now() + Math.random(), text, done: false }));
                    lastResetDate = null;
                    resetNeeded = true;
                }

                // Check if we need to reset (new day)
                if (lastResetDate !== today) {
                    mergedTasks = mergedTasks.map(t => ({ ...t, done: false }));
                    lastResetDate = today;
                    resetNeeded = true;
                }

                // If reset needed, save to cloud and local
                if (resetNeeded) {
                    const dataToSave = { tasks: mergedTasks, lastReset: lastResetDate };
                    saveToLocal(dataToSave);
                    if (USE_JSONSILO) {
                        saveToJSONSilo(dataToSave).then(success => {
                            updateSyncStatus(success ? '✅ Synced' : '⚠️ Sync failed (saved locally)', success);
                        });
                    }
                }

                return { tasks: mergedTasks, lastReset: lastResetDate };
            }

            // ---- UI update ----
            function renderTasks() {
                const container = document.getElementById('taskList');
                if (!container) return;
                if (tasks.length === 0) {
                    container.innerHTML = `<div style="text-align:center;color:#94a3b8;padding:1rem;">No tasks yet. Add one above!</div>`;
                    updateStats();
                    return;
                }
                let html = '';
                tasks.forEach((task, index) => {
                    const checked = task.done ? 'checked' : '';
                    const labelClass = task.done ? 'task-label checked' : 'task-label';
                    html += `
                        <div class="task-item" data-index="${index}">
                            <input type="checkbox" ${checked} onchange="window.toggleTask(${index})" />
                            <span class="${labelClass}">${task.text}</span>
                            <button class="task-delete" onclick="window.deleteTask(${index})" title="Delete task">✕</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
                updateStats();
            }

            function updateStats() {
                const total = tasks.length;
                const done = tasks.filter(t => t.done).length;
                const countEl = document.getElementById('taskCount');
                const progressEl = document.getElementById('taskProgress');
                if (countEl) countEl.textContent = `${done}/${total}`;
                if (progressEl) {
                    const pct = total === 0 ? 0 : Math.round((done / total) * 100);
                    progressEl.style.width = pct + '%';
                }
            }

            function updateSyncStatus(msg, isSuccess = null) {
                const el = document.getElementById('syncStatus');
                if (el) {
                    el.textContent = msg;
                    el.className = 'sync-status';
                    if (isSuccess === true) el.classList.add('success');
                    else if (isSuccess === false) el.classList.add('error');
                }
            }

            // ---- Expose toggle/delete globally ----
            window.toggleTask = function (index) {
                if (tasks[index]) {
                    tasks[index].done = !tasks[index].done;
                    const dataToSave = { tasks, lastReset: getDhakaDate() };
                    saveToLocal(dataToSave);
                    if (USE_JSONSILO) {
                        updateSyncStatus('🔄 Syncing...');
                        saveToJSONSilo(dataToSave).then(success => {
                            updateSyncStatus(success ? '✅ Synced' : '⚠️ Sync failed', success);
                        });
                    }
                    renderTasks();
                }
            };

            window.deleteTask = function (index) {
                if (confirm('Are you sure you want to delete this task?')) {
                    tasks.splice(index, 1);
                    const dataToSave = { tasks, lastReset: getDhakaDate() };
                    saveToLocal(dataToSave);
                    if (USE_JSONSILO) {
                        updateSyncStatus('🔄 Syncing...');
                        saveToJSONSilo(dataToSave).then(success => {
                            updateSyncStatus(success ? '✅ Synced' : '⚠️ Sync failed', success);
                        });
                    }
                    renderTasks();
                }
            };

            // ---- Add new task ----
            function addTask() {
                const input = document.getElementById('taskInput');
                const text = input.value.trim();
                if (text === '') {
                    alert('Please enter a task description.');
                    return;
                }
                tasks.push({ id: Date.now(), text, done: false });
                const dataToSave = { tasks, lastReset: getDhakaDate() };
                saveToLocal(dataToSave);
                if (USE_JSONSILO) {
                    updateSyncStatus('🔄 Syncing...');
                    saveToJSONSilo(dataToSave).then(success => {
                        updateSyncStatus(success ? '✅ Synced' : '⚠️ Sync failed', success);
                    });
                }
                renderTasks();
                input.value = '';
                input.focus();
            }

            // ---- Initialise ----
            async function init() {
                // 1. Load from cloud and local
                const cloudData = await loadFromJSONSilo();
                const localData = loadFromLocal();

                // 2. Merge and reset if needed
                const result = mergeAndReset(cloudData, localData);
                tasks = result.tasks;
                lastResetDate = result.lastReset;

                // 3. Render
                renderTasks();

                // 4. If cloud data was missing, push to cloud
                if (!cloudData && USE_JSONSILO) {
                    const dataToSave = { tasks, lastReset: lastResetDate };
                    const saved = await saveToJSONSilo(dataToSave);
                    updateSyncStatus(saved ? '✅ Synced' : '⚠️ Sync failed (saved locally)', saved);
                } else {
                    updateSyncStatus('✅ Ready', true);
                }

                // 5. Set up add button
                const addBtn = document.getElementById('addTaskBtn');
                const input = document.getElementById('taskInput');
                if (addBtn && input) {
                    addBtn.addEventListener('click', addTask);
                    input.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') addTask();
                    });
                }
            }

            // Start
            init();
        }

        // ──────────────────────────────────────────────────────────────
        // 5. DARK MODE SYNC WITH PARENT
        // ──────────────────────────────────────────────────────────────
        (function syncTheme() {
            function applyTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }

            try {
                const parentDark = window.parent.document.documentElement.classList.contains('dark');
                applyTheme(parentDark);
            } catch (e) {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    applyTheme(true);
                }
            }

            window.addEventListener('message', function (e) {
                if (e.data && typeof e.data.theme === 'string') {
                    applyTheme(e.data.theme === 'dark');
                }
            });
        })();

        // ──────────────────────────────────────────────────────────────
        // 6. BOOT
        // ──────────────────────────────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            renderSchedule(scheduleData);
        });
    </script>
